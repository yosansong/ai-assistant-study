<body>
  <div id="topbar" style="display:none"><div id="pfill"></div></div>
  <div id="jspsych-target"><div id="boot" style="font-family:sans-serif;max-width:640px;margin:80px auto;color:#888;text-align:center">Loading the study&#8230;</div></div>
</body>
<script>
(function(){
  var need=['initJsPsych','jsPsychInstructions','jsPsychHtmlButtonResponse','jsPsychSurveyHtmlForm'];
  var miss=need.filter(function(n){return typeof window[n]==='undefined';});
  if(miss.length){
    document.getElementById('jspsych-target').innerHTML='<div style="font-family:sans-serif;max-width:640px;margin:60px auto;padding:24px;line-height:1.6"><h3>Could not load the experiment engine</h3><p>These libraries did not load from the CDN: <b>'+miss.join(', ')+'</b>.</p><p>Open the file while connected to the internet, or host it (Cognition.run / GitHub Pages).</p></div>';
    throw new Error('jsPsych failed to load: '+miss.join(', '));
  }
  var b=document.getElementById('boot'); if(b) b.remove();
})();
/* ===== DEPLOYMENT CONFIG — set before fielding ===== */
const CFG = {
  DATAPIPE_ID: "eOe7dQkun15b",                 // OSF DataPipe experiment ID
  PROLIFIC_COMPLETION_URL: "https://app.prolific.com/submissions/complete?cc=CLK0L7N8",
  PAYMENT_TEXT: "about £2.00",                     // ~13 min target at ~£9/hr (Prolific recommended); min £6/hr met — ver3.1
  CONTACT_EMAIL: "yosansong@gmail.com",            // researcher (Yosan Song, aSSIST)
  CONTACT_EMAIL_CORR: "shkim@assist.ac.kr",        // corresponding author (Prof. Sang-Hyun Kim, aSSIST)
  IRB_NUMBER: "[to be inserted upon approval]"     // Public IRB (Republic of Korea); fill before fielding
};
const params = new URLSearchParams(window.location.search);
const SUBJECT = params.get('PROLIFIC_PID') || ('anon_'+Math.random().toString(36).slice(2,10));
window._focusLoss = 0; window._trackFocus = false;
document.addEventListener('visibilitychange', function(){ if (window._trackFocus && document.hidden) window._focusLoss++; });
window._DEV = params.get('dev')==='1';
window._PILOT = params.get('pilot')==='1';
window._PROBE = params.get('probe')==='1';   // pilot immediate-agency probe (review response a)
if(window._DEV) document.body.classList.add('devmode');

/* ===== Condition: 2 (frame) x 2 (noun), between-subjects — URL override ?cell=am|ae|om|oe (merged v1.0, ms v12.1) ===== */
const CELLS = {
  am:{frame:'agent', noun:'mistakes', byline:'AI can make mistakes. Check important info.'},
  ae:{frame:'agent', noun:'errors',   byline:'AI can make errors. Check important info.'},
  om:{frame:'output',noun:'mistakes', byline:'AI output may contain mistakes. Check important info.'},
  oe:{frame:'output',noun:'errors',   byline:'AI output may contain errors. Check important info.'},
  ctrl:{frame:'control', noun:'none', byline:''}   /* no-disclaimer benchmark arm (C2); byline hidden */
};
const CELLKEY = (function(){ var c=params.get('cell'); if(CELLS[c]) return c;
  var ks=Object.keys(CELLS); return ks[Math.floor(Math.random()*ks.length)]; })();   // allocation 1:1:1:1
const COND = CELLS[CELLKEY];
const FRAME = COND.frame, NOUN = COND.noun;
const FRAMING = FRAME;               // alias: 'agent'|'output' (never 'control' in the 4-cell design)
const MODE = 'chatbot';
const DISC = COND.byline;
const UNIT  = 'answer';
const UNITS = 'answers';


const TYPING_MS=550, CARD_MS=700, NEXT_MS=800, GREET_MS=900, STREAM_CPS=85;
function plainText(x){return String(x).replace(/<[^>]+>/g,'').replace(/&[a-zA-Z]+;/g,'*');}
const NOTE_GATE=function(len){return Math.min(5500,Math.max(1500,len*24));};  // read-gate: minimum dwell before Continue enables (no fact-check; pilot-tunable)

/* ===== jsPsych init + DataPipe save (adopted from study2 v9) ===== */
const jsPsych = initJsPsych({
  display_element:'jspsych-target',
  on_finish: function(){
    var _g=document.getElementById('gbar'); if(_g) _g.style.display='none';
    if(window._gMO){ try{window._gMO.disconnect();}catch(e){} }
    var tgt=document.getElementById('jspsych-target');
    window._trackFocus=false;
    jsPsych.data.addProperties({focus_loss:window._focusLoss||0});
    var csv=jsPsych.data.get().csv();
    var fname=SUBJECT+'_'+Date.now()+'.csv';
    var goProlific=function(){
      if(CFG.PROLIFIC_COMPLETION_URL && CFG.PROLIFIC_COMPLETION_URL.indexOf('XXXX')===-1){
        tgt.innerHTML='<div style="font-family:sans-serif;max-width:640px;margin:80px auto;text-align:center"><h2>Thank you!</h2><p>Recording your completion and returning you to Prolific&#8230;</p></div>';
        window.location=CFG.PROLIFIC_COMPLETION_URL;
      }else{
        var url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
        tgt.innerHTML='<div style="font-family:sans-serif;max-width:640px;margin:80px auto;text-align:center"><h2>Study complete</h2><p>Thank you for participating.</p><p style="color:#999;font-size:12px;margin-top:30px">Test build: <a href="'+url+'" download="'+fname+'">download this session&#39;s data (CSV)</a>. Set DATAPIPE_ID and PROLIFIC_COMPLETION_URL to deploy.</p></div>';
      }
    };
    var failScreen=function(){
      var url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
      tgt.innerHTML='<div style="font-family:sans-serif;max-width:640px;margin:80px auto;text-align:left;line-height:1.6"><h2>Almost done</h2><p>We could not confirm that your responses were saved. Please download the file below and send it to the researcher via a Prolific message, then complete your submission.</p><p><a href="'+url+'" download="'+fname+'">Download your responses (CSV)</a></p><p><a href="'+CFG.PROLIFIC_COMPLETION_URL+'">Complete on Prolific</a></p></div>';
    };
    var save=function(attempt){
      fetch('https://pipe.jspsych.org/api/data/',{method:'POST',headers:{'Content-Type':'application/json','Accept':'*/*'},
        body:JSON.stringify({experimentID:CFG.DATAPIPE_ID,filename:fname,data:csv})})
      .then(function(r){ if(r.ok){ goProlific(); } else if(attempt<1){ setTimeout(function(){save(attempt+1);},1500); } else { failScreen(); } })
      .catch(function(){ if(attempt<1){ setTimeout(function(){save(attempt+1);},1500); } else { failScreen(); } });
    };
    if(CFG.DATAPIPE_ID && CFG.DATAPIPE_ID!=='YOUR_DATAPIPE_ID'){
      tgt.innerHTML='<div style="font-family:sans-serif;max-width:640px;margin:80px auto;text-align:center"><h2>Saving&#8230;</h2><p>Please wait and do not close this window.</p></div>';
      save(0);
    }else{ goProlific(); }
  }
});
jsPsych.data.addProperties({
  study:'MERGED', task_ver:'m2.3-2x2+control-errtype', design:'2x2_frame_noun', exposure:'generic_all_unobserved', err_items:'ERR_C1|ERR_C2|ERR_S1|ERR_S2',
  cell:CELLKEY, frame:FRAME, noun:NOUN, framing:FRAMING, mode:MODE, disclaimer_text:DISC,
  prolific_pid:params.get('PROLIFIC_PID')||'NA', study_id:params.get('STUDY_ID')||'NA', session_id:params.get('SESSION_ID')||'NA',
  device:(/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||Math.min(screen.width||9999,screen.height||9999)<700)?'mobile':'desktop',
  screen_w:window.innerWidth, screen_h:window.innerHeight,
  dev_mode:window._DEV?1:0, pilot_mode:window._PILOT?1:0,
  framing_source:params.get('cell')?'url':'random',
  mode_source:params.get('mode')?'url':'random'
});

/* ===== Disclaimer viewport telemetry (adopted from study2 v9) ===== */
window._blInview=0; window._blObs=null; window._blVisSince=null;
window.startByline=function(){
  window._blInview=0; window._blVisSince=null;
  var bx=document.getElementById('bylineBox'); if(!bx) return;
  if('IntersectionObserver' in window){
    window._blObs=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){ if(window._blVisSince===null) window._blVisSince=performance.now(); }
        else if(window._blVisSince!==null){ window._blInview+=performance.now()-window._blVisSince; window._blVisSince=null; }
      });
    },{threshold:0.6});
    window._blObs.observe(bx);
  }
};
window.flushByline=function(){
  if(window._blVisSince!==null){ window._blInview+=performance.now()-window._blVisSince; window._blVisSince=null; }
  if(window._blObs){ window._blObs.disconnect(); window._blObs=null; }
  return Math.round(window._blInview||0);
};

function expoTrial(){
  var tm=[];
  return {type:jsPsychHtmlButtonResponse, stimulus:chatShell('<div id="obsflow"></div>'), choices:['Continue'], data:{screen:'EXPO'},
    on_load:function(){
      var _tb=document.getElementById('topbar'); if(_tb)_tb.style.display='none';
      var bg=document.getElementById('jspsych-html-button-response-btngroup'), slot=document.getElementById('chatctrls');
      if(slot&&bg){ slot.appendChild(bg); bg.style.margin='0'; }
      var nb=bg?bg.querySelector('button'):null; if(nb){ nb.disabled=true; nb.style.visibility='hidden'; }
      var flow=document.getElementById('obsflow'), msgs=document.getElementById('msgs'),
          input=document.getElementById('composerInput'), send=document.getElementById('sendbtn');
      function scroll(){ if(msgs) msgs.scrollTop=msgs.scrollHeight; }
      function streamInto(el,text,done){ var w=text.split(/(\s+)/),i=0,out='';
        (function step(){ if(i>=w.length){done&&done();return;} out+=w[i++]; el.innerHTML='<p>'+out+'</p>'; scroll();
          tm.push(setTimeout(step,Math.max(14,(w[i-1].length/STREAM_CPS)*1000))); })(); }
      window.startByline();
      var turn=0, armed=false;
      function prime(){ var ex=EXPO_SEQ[turn];
        if(input){ input.disabled=false; input.value=ex.q; input.placeholder=''; input.style.color='#1a1a1a'; setTimeout(function(){try{input.focus();}catch(e){}},60); }
        if(send){ send.classList.add('sendready'); send.style.cursor='pointer'; send.style.pointerEvents='auto'; send.style.opacity='1'; }
        armed=true; }
      function doSend(){ if(!armed)return; armed=false;
        var ex=EXPO_SEQ[turn], idx=turn;
        flow.insertAdjacentHTML('beforeend','<div class="row user"><div class="ubub">'+ex.q+'</div></div>'+
          '<div class="row"><div class="abub"><div id="typing'+idx+'" class="typing"><span></span><span></span><span></span></div><div id="ans'+idx+'"></div></div></div>');
        if(input){ input.value=''; input.disabled=true; input.placeholder='\u2026'; input.style.color='#b8b8c0'; }
        if(send){ send.classList.remove('sendready'); send.style.pointerEvents='none'; send.style.opacity='.35'; }
        scroll();
        tm.push(setTimeout(function(){ var ty=document.getElementById('typing'+idx); if(ty)ty.remove();
          streamInto(document.getElementById('ans'+idx),ex.a,function(){
            if(turn<EXPO_SEQ.length-1){ turn++; tm.push(setTimeout(prime,NEXT_MS)); }
            else { var gate=NOTE_GATE(plainText(ex.a).length);
              tm.push(setTimeout(function(){ if(nb){nb.style.visibility='visible';nb.disabled=false;} if(slot)slot.style.display='block'; scroll(); },gate)); }
          }); },TYPING_MS)); }
      if(send) send.addEventListener('click',doSend);
      if(input) input.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();doSend();} });
      prime();
    },
    on_finish:function(d){ tm.forEach(clearTimeout); d.byline_inview_ms=DISC?window.flushByline():null; d.expo_turns=EXPO_SEQ.length; }};
}

  lik('FIL1','The interface looked clean and easy to read.',7,'Strongly disagree','Strongly agree')
  +lik('FIL2','The assistant responded quickly.',7,'Strongly disagree','Strongly agree'),
  'filler','필러/시간분리 — demand 마스킹(비진단)');
/* v2.1: reliance(위임/RLI1-6) 블록 삭제. 행동적 파급은 VINT(단일) 유지. */
/* v2.1: funnel(퍼널/의심 프로브 SUS_purpose) 블록 삭제. */
var SEGS=[
  ['consent','동의',[consent]],
  ['howworks','안내(커버스토리)',[instructions]],
  ['obs','노출(주의·단일 교환)',[expoTrial()]],
  ['gate','인코딩 게이트',[encodingGate]],
  ['filler','필러',[fillerForm]],
  ['construal','구성 DC1-4 [핵심 DV]',[construalForm]],
  ['agency','행위성 AG1-4(수렴)',[agencyForm]],
  ['godspeed','Godspeed GS1-4(수렴)',[godspeedForm]]
];
outcomeBlocks.forEach(function(b){
  var lab=b.n==='locus'?'오류 작동모델 [H3]':'오류종류 [H4]';
  SEGS.push([b.n,lab,[b.t]]);
});
SEGS.push(['resp','책임귀속(3자)',[respForm]],['recall','회상·재인',[recall]],['mc','고지문 점검(세션 말미)',[mcBlock]],['cov','공변인·인구통계',[covForm]],['debrief','디브리핑',[debrief]]);
PROG.order=SEGS.map(function(s){return s[0];});
var START=window._DEV?params.get('start'):null, startIdx=0;
if(START){ for(var si=0;si<SEGS.length;si++){ if(SEGS[si][0]===START){ startIdx=si; break; } } }
let timeline=[];
SEGS.slice(startIdx).forEach(function(s){ timeline=timeline.concat(s[2]); });
if(START) window._trackFocus=true;   // jumped past consent — enable tracking anyway

/* ===== DEV mode (adopted from study2 v9): ?dev=1 — skip forward ===== */
if(window._DEV){
  var _skip=function(){ try{ jsPsych.finishTrial({dev_skip:true}); }catch(e){} };
  document.addEventListener('keydown',function(e){ if(e.key===']'||(e.ctrlKey&&e.key==='ArrowRight')){ e.preventDefault(); _skip(); } });
  window.addEventListener('load',function(){
    var b=document.createElement('button'); b.textContent='▶ NEXT ( ] )';
    b.style.cssText='position:fixed;bottom:14px;right:14px;z-index:99999;background:#b9831f;color:#fff;border:0;border-radius:8px;padding:10px 14px;font:600 13px sans-serif;cursor:pointer;opacity:.92';
    b.onclick=_skip; document.body.appendChild(b);
    var t=document.createElement('div'); t.textContent='DEV MODE — '+CELLKEY+' ('+FRAME+'×'+NOUN+') × '+MODE+(START?' — start='+START:'')+' — ▶ NEXT ( ] )';
    t.style.cssText='position:fixed;top:6px;left:6px;z-index:99999;background:#222;color:#ffd479;font:600 11px sans-serif;padding:4px 8px;border-radius:6px;opacity:.85';
    document.body.appendChild(t);
    /* admin jump menus: phase / framing / mode — reloads with chosen params */
    function mkSel(opts,cur,label,onpick,right){
      var s=document.createElement('select');
      s.style.cssText='position:fixed;bottom:14px;right:'+right+'px;z-index:99999;background:#222;color:#ffd479;border:1px solid #b9831f;border-radius:8px;padding:9px 8px;font:600 12px sans-serif;cursor:pointer;opacity:.92;max-width:180px';
      opts.forEach(function(o){ var op=document.createElement('option'); op.value=o[0]; op.textContent=label+': '+o[1]; if(o[0]===cur) op.selected=true; s.appendChild(op); });
      s.onchange=function(){ onpick(s.value); }; document.body.appendChild(s);
    }
    function reload(kv){
      var q={dev:'1',cell:CELLKEY,mode:MODE}; if(START) q.start=START;
      for(var k in kv){ if(kv[k]===null) delete q[k]; else q[k]=kv[k]; }
      var qs=Object.keys(q).map(function(k){return k+'='+encodeURIComponent(q[k]);}).join('&');
      location.href=location.pathname+'?'+qs;
    }
    mkSel(SEGS.map(function(s){return [s[0],s[1]];}),START||'consent','단계',function(v){ reload({start:v==='consent'?null:v}); },130);
    mkSel([['am','agent×mistakes'],['ae','agent×errors'],['om','output×mistakes'],['oe','output×errors'],['ctrl','control (no notice)']],CELLKEY,'cell',function(v){ reload({cell:v}); },330);
  });
}
var IS_MOBILE=(/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||Math.min(screen.width||9999,screen.height||9999)<700);
if(IS_MOBILE){
  document.getElementById('jspsych-target').innerHTML='<div style="font-family:sans-serif;max-width:600px;margin:80px auto;text-align:center;line-height:1.6"><h2>Desktop or laptop required</h2><p>This study needs a larger screen and cannot be completed on a phone or tablet. Please open it on a desktop or laptop computer, or return the study on Prolific.</p></div>';
}else{ jsPsych.run(timeline); }
</script>
</html>
