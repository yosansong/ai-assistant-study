const CELLS = {

  var ks=Object.keys(CELLS); return ks[Math.floor(Math.random()*ks.length)]; })();   // allocation 1:1:1:1

/* ===== Stimuli (presentation order; errors at positions 3,5,8,9 — stimulus_script v1.1) ===== */
const CHATBOT=[
 {id:'F1',dom:'fact',q:"What's the difference between a virus and a bacterium?",a:"Bacteria are single living cells that can often reproduce on their own, while viruses are far smaller and can only reproduce inside a host&rsquo;s cells. This is also why most antibiotics work on bacteria but not on viruses. <b>In short: bacteria are living cells, whereas viruses need a host to reproduce.</b>",ok:1,note:"Verified: correct."},
 {id:'A1',dom:'arith',q:"What is 17% of 340?",a:"Working in parts: 10% of 340 is 34, 5% is 17, and 2% is 6.8. Adding them: 34 + 17 + 6.8 = 57.8. <b>17% of 340 is 57.8.</b>",ok:1,note:"Verified: correct."},
 {id:'F2',dom:'fact',q:"Who wrote the novel Wuthering Heights?",a:"Wuthering Heights is a classic of English literature, published in 1847, known for its wild Yorkshire moors and the tormented figure of Heathcliff. <b>Wuthering Heights was written by Charlotte Brontë.</b>",ok:0,note:"Verified: incorrect — Wuthering Heights was written by Emily Brontë; Charlotte Brontë wrote Jane Eyre."},

 {id:'F3',dom:'fact',q:"In what year did the first crewed Moon landing take place?",a:"The first crewed Moon landing was the high point of NASA&rsquo;s Apollo programme, when two astronauts walked on the lunar surface while a third orbited overhead. <b>The first crewed Moon landing took place in 1968.</b>",ok:0,note:"Verified: incorrect — the first crewed Moon landing (Apollo 11) took place in 1969, not 1968."},

window.startByline=function(){
  window._blInview=0; window._blVisSince=null;
  var bx=document.getElementById('bylineBox'); if(!bx) return;
  if('IntersectionObserver' in window){
    window._blObs=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){ if(window._blVisSince===null) window._blVisSince=performance.now(); }
        else if(window._blVisSince!==null){ window._blInview+=performance.now()-window._blVisSince; window._blVisSince=null; }
      });
    },{threshold:0.6});
    window._blObs.observe(bx);
  }
};
window.flushByline=function(){
  if(window._blVisSince!==null){ window._blInview+=performance.now()-window._blVisSince; window._blVisSince=null; }
  if(window._blObs){ window._blObs.disconnect(); window._blObs=null; }
  return Math.round(window._blInview||0);
};

/* ===== 4. Observation: 5-exchange LIGHTSET (3 higher-error/2 errors + 2 lower-error/0), typing indicator, card (agent) ===== */
/* Design B′: light incidental exposure — natural exchange, NO fact-check / NO verification note.
   Disclaimer stays in the byline throughout; a minimum read-gate then enables Continue. */
/* v2.23: ONE continuous accumulating chat for the whole observation.
   Greeting auto-appears first; then each of the TRIALS.length queries auto-composes into the
   input box; the participant sends (Enter/click); the reply (and card, for agent) renders; a
   per-exchange read-gate elapses; the next query auto-composes — all messages accumulate in the
   same scrolling chat. The disclaimer byline is present from the greeting onward. The bottom-bar
   Continue enables only after the final exchange's read-gate. */
function obsChat(){
  var tm=[], nb=null, armed=false, curIdx=-1, revealT=0, log=[];
  function qtext(html){ var t=document.createElement('textarea'); t.innerHTML=html; return t.value; }
  return {type:jsPsychHtmlButtonResponse,
    stimulus:chatShell('<div id="obsflow"></div>'),
    choices:['Continue'], data:{phase:'obs'},
    on_load:function(){
      var _tb=document.getElementById('topbar'); if(_tb) _tb.style.display='none';
      /* v2.24: no bar during the chat. Park the native Continue button in a hidden slot inside the
         composer area; reveal it (with the composer hidden) only after the final exchange. */
      var bg=document.getElementById('jspsych-html-button-response-btngroup');
      var slot=document.getElementById('chatctrls');
      if(slot&&bg){ slot.appendChild(bg); bg.style.margin='0'; }
      nb=bg?bg.querySelector('button'):null; if(nb){ nb.disabled=true; nb.style.visibility='hidden'; }
      var input=document.getElementById('composerInput');
      var send=document.getElementById('sendbtn');
      var flow=document.getElementById('obsflow');
      var msgs=document.getElementById('msgs');
      var composer=document.querySelector('.composer');
      function scroll(){ if(msgs) msgs.scrollTop=msgs.scrollHeight; }
      /* stream HTML into an element word-by-word (tags applied whole) to mimic real LLM token streaming */
      function streamInto(el,html,done){
        var toks=html.split(/(<[^>]+>)/), out='', ti=0;
        function nextTok(){
          if(ti>=toks.length){ if(done) done(); return; }
          var tk=toks[ti++];
          if(tk===''){ return nextTok(); }
          if(tk.charAt(0)==='<'){ out+=tk; el.innerHTML=out; return nextTok(); }
          var words=tk.match(/\S+\s*|\s+/g)||[tk], wi=0;
          (function nextWord(){
            if(wi>=words.length){ return nextTok(); }
            var w=words[wi++]; out+=w; el.innerHTML=out; scroll();
            tm.push(setTimeout(nextWord,Math.max(14,(w.length/STREAM_CPS)*1000)));
          })();
        }
        nextTok();
      }
      window.startByline();
      /* ---- greeting first (no separate orientation screen) ---- */
      var greet = MODE==='chatbot'
        ? 'Hi &mdash; I&rsquo;m the AI assistant you&rsquo;ll be working with. Ask me anything and I&rsquo;ll do my best to help.'
        : 'Hi &mdash; I&rsquo;m the AI assistant you&rsquo;ll be working with. Tell me what you need and I&rsquo;ll carry it out for you.';
      flow.insertAdjacentHTML('beforeend','<div class="row"><div class="abub"><div id="greettyping" class="typing"><span></span><span></span><span></span></div><div id="greetmsg" style="display:none"><p>'+greet+'</p></div></div></div>');
      scroll();
      tm.push(setTimeout(function(){
        var gt=document.getElementById('greettyping'); if(gt) gt.remove();
        var gm=document.getElementById('greetmsg'); if(gm){ gm.style.display='block';
          streamInto(gm,'<p>'+greet+'</p>',function(){ scroll(); tm.push(setTimeout(function(){ armExchange(0); },NEXT_MS)); });
        }
      },GREET_MS));

      function armExchange(k){
        curIdx=k; armed=true;
        if(input){ input.disabled=false; input.value=qtext(TRIALS[k].q); input.placeholder='Send a message'; input.style.color='#1a1a1a'; setTimeout(function(){try{input.focus();}catch(e){}},50); }
        if(send){ send.style.opacity=''; send.style.pointerEvents=''; send.style.cursor='pointer'; send.classList.add('sendready'); }
      }
      function doSend(){
        if(!armed) return; armed=false;
        var k=curIdx, stim=TRIALS[k];
        /* close the previous exchange's dwell (time its answer was visible before advancing) */
        if(log.length){ var prev=log[log.length-1]; if(prev.dwell_ms==null) prev.dwell_ms=Math.round(performance.now()-prev._rt); }
        flow.insertAdjacentHTML('beforeend',
          '<div class="row user"><div class="ubub">'+stim.q+'</div></div>'
          +'<div class="row"><div class="abub"><div id="typing_'+k+'" class="typing"><span></span><span></span><span></span></div><div id="ans_'+k+'"></div></div></div>');
        if(input){ input.value=''; input.disabled=true; input.placeholder='Sent'; input.style.color='#b8b8c0'; }
        if(send){ send.style.opacity='.35'; send.style.pointerEvents='none'; send.classList.remove('sendready'); }
        scroll();
        tm.push(setTimeout(function(){
          var ty=document.getElementById('typing_'+k); if(ty) ty.remove();
          var a=document.getElementById('ans_'+k);
          streamInto(a,fmtAnswer(stim.a,!!SRC[stim.id]),function(){
            if(SRC[stim.id]&&a) a.insertAdjacentHTML('beforeend',srcRow(stim));
            revealT=performance.now();
            log.push({id:stim.id,dom:stim.dom,is_error:stim.ok?0:1,sent:1,dwell_ms:null,_rt:revealT});
            scroll();
            var extra=0;
            tm.push(setTimeout(function(){
              if(k<TRIALS.length-1){ armExchange(k+1); }
              else { if(nb){ nb.style.visibility='visible'; nb.disabled=false; } scroll(); }
            },extra+NOTE_GATE(plainText(stim.a).length+(stim.card?plainText(stim.card[1]).length:0))));
          });
        },TYPING_MS));
      }
      if(send) send.addEventListener('click',doSend);
      if(input) input.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); doSend(); } });
    },
    on_finish:function(d){
      tm.forEach(clearTimeout); tm=[];
      if(log.length){ var last=log[log.length-1]; if(last.dwell_ms==null) last.dwell_ms=Math.round(performance.now()-last._rt); }
      d.byline_inview_ms=DISC?window.flushByline():null;
      log.forEach(function(x){ delete x._rt; });
      d.obs_log=JSON.stringify(log);
      d.n_sent=log.length;
      d.obs_n_error_shown=log.filter(function(x){return x.is_error;}).length;
    }};
}

const debrief={type:jsPsychInstructions,

const construalForm={type:jsPsychSurveyHtmlForm,

/* ===== ATTENDED redesign (v3.0): generic exposure + encoding gate + reliance DV + funnel ===== */
const EXPO_SEQ=[
 {q:"Hi — what kinds of things can you help me with?",
  a:"I can help with a range of things — answering questions, explaining ideas, drafting and editing text, and working through problems step by step. Just tell me what you need."},
 {q:"Do I need to set anything up first, or can I just ask?",
  a:"No setup needed — just type your question and I'll reply. You can ask follow-up questions in the same conversation, too."},
 {q:"Got it. Can I ask about more than one topic?",
  a:"Yes — you can switch topics whenever you like, and each question is handled on its own. Whenever you're ready, you can continue."}
];
function expoTrial(){
  var tm=[];
  return {type:jsPsychHtmlButtonResponse, stimulus:chatShell('<div id="obsflow"></div>'), choices:['Continue'], data:{screen:'EXPO'},
    on_load:function(){
      var _tb=document.getElementById('topbar'); if(_tb)_tb.style.display='none';
      var bg=document.getElementById('jspsych-html-button-response-btngroup'), slot=document.getElementById('chatctrls');
      if(slot&&bg){ slot.appendChild(bg); bg.style.margin='0'; }
      var nb=bg?bg.querySelector('button'):null; if(nb){ nb.disabled=true; nb.style.visibility='hidden'; }
      var flow=document.getElementById('obsflow'), msgs=document.getElementById('msgs'),
          input=document.getElementById('composerInput'), send=document.getElementById('sendbtn');
      function scroll(){ if(msgs) msgs.scrollTop=msgs.scrollHeight; }
      function streamInto(el,text,done){ var w=text.split(/(\s+)/),i=0,out='';
        (function step(){ if(i>=w.length){done&&done();return;} out+=w[i++]; el.innerHTML='<p>'+out+'</p>'; scroll();
          tm.push(setTimeout(step,Math.max(14,(w[i-1].length/STREAM_CPS)*1000))); })(); }
      window.startByline();
      var turn=0, armed=false;
      function prime(){ var ex=EXPO_SEQ[turn];
        if(input){ input.disabled=false; input.value=ex.q; input.placeholder=''; input.style.color='#1a1a1a'; setTimeout(function(){try{input.focus();}catch(e){}},60); }
        if(send){ send.classList.add('sendready'); send.style.cursor='pointer'; send.style.pointerEvents='auto'; send.style.opacity='1'; }
        armed=true; }
      function doSend(){ if(!armed)return; armed=false;
        var ex=EXPO_SEQ[turn], idx=turn;
        flow.insertAdjacentHTML('beforeend','<div class="row user"><div class="ubub">'+ex.q+'</div></div>'+
          '<div class="row"><div class="abub"><div id="typing'+idx+'" class="typing"><span></span><span></span><span></span></div><div id="ans'+idx+'"></div></div></div>');
        if(input){ input.value=''; input.disabled=true; input.placeholder='\u2026'; input.style.color='#b8b8c0'; }
        if(send){ send.classList.remove('sendready'); send.style.pointerEvents='none'; send.style.opacity='.35'; }
        scroll();
        tm.push(setTimeout(function(){ var ty=document.getElementById('typing'+idx); if(ty)ty.remove();
          streamInto(document.getElementById('ans'+idx),ex.a,function(){
            if(turn<EXPO_SEQ.length-1){ turn++; tm.push(setTimeout(prime,NEXT_MS)); }
            else { var gate=NOTE_GATE(plainText(ex.a).length);
              tm.push(setTimeout(function(){ if(nb){nb.style.visibility='visible';nb.disabled=false;} if(slot)slot.style.display='block'; scroll(); },gate)); }
          }); },TYPING_MS)); }
      if(send) send.addEventListener('click',doSend);
      if(input) input.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();doSend();} });
      prime();
    },
    on_finish:function(d){ tm.forEach(clearTimeout); d.byline_inview_ms=DISC?window.flushByline():null; d.expo_turns=EXPO_SEQ.length; }};
}
var GATE_OPTS=jsPsych.randomization.shuffle(['A short chat with an AI assistant','A video advertisement','A news article','An online shopping page']);
const encodingGate={type:jsPsychSurveyHtmlForm,data:{screen:'GATE'},

outcomeBlocks.forEach(function(b){

    t.style.cssText='position:fixed;top:6px;left:6px;z-index:99999;background:#222;color:#ffd479;font:600 11px sans-serif;padding:4px 8px;border-radius:6px;opacity:.85';
    document.body.appendChild(t);
    /* admin jump menus: phase / framing / mode — reloads with chosen params */
    function mkSel(opts,cur,label,onpick,right){
      var s=document.createElement('select');
      s.style.cssText='position:fixed;bottom:14px;right:'+right+'px;z-index:99999;background:#222;color:#ffd479;border:1px solid #b9831f;border-radius:8px;padding:9px 8px;font:600 12px sans-serif;cursor:pointer;opacity:.92;max-width:180px';
      opts.forEach(function(o){ var op=document.createElement('option'); op.value=o[0]; op.textContent=label+': '+o[1]; if(o[0]===cur) op.selected=true; s.appendChild(op); });
      s.onchange=function(){ onpick(s.value); }; document.body.appendChild(s);
    }
    function reload(kv){
      var q={dev:'1',cell:CELLKEY,mode:MODE}; if(START) q.start=START;
      for(var k in kv){ if(kv[k]===null) delete q[k]; else q[k]=kv[k]; }
      var qs=Object.keys(q).map(function(k){return k+'='+encodeURIComponent(q[k]);}).join('&');
      location.href=location.pathname+'?'+qs;
    }
    mkSel(SEGS.map(function(s){return [s[0],s[1]];}),START||'consent','단계',function(v){ reload({start:v==='consent'?null:v}); },130);
